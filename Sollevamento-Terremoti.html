    /* ---------- ricerca binaria ---------- */
    function lowerBound(arr, v) { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] < v) lo = mid + 1; else hi = mid; } return lo; }
    const countInRange = (t0, t1) => lowerBound(eqT, t1 + 1e-6) - lowerBound(eqT, t0 - 1e-6);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---------- uPlot ---------- */
    /* range: alla prima chiamata (render iniziale) usa l'intervallo fisso,
       poi restituisce i limiti richiesti da pan/zoom (un array fisso bloccherebbe la scala) */
    const mkRange = (init) => {
      let first = true;
      return (uu, min, max) => {
        if (first) { first = false; return init; }
        return [min, max];
      };
    };
    const axisCommon = {
      font: '11px Arial',
      stroke: muted,
      grid: { stroke: border, width: 1 },
      ticks: { stroke: border, width: 1, size: 6 },
    };
    const opts = {
      width: main.clientWidth,
      height: main.clientHeight,
      legend: { show: false },
      cursor: {
        drag: { x: false, y: false, setScale: false },
        x: { show: false }, y: { show: false },
        points: { show: false },
      },
      select: { show: false },
      scales: {
        x: { time: true, range: mkRange([T0, T1]) },
        y: { range: mkRange([Y0, Y1]) },
        y2: { range: mkRange([Y2_0, Y2_1]) },
      },
      axes: [
        Object.assign({}, axisCommon, {
          time: true,
          /* formato basato sulla distanza tra tick (evita anni duplicati con tick semestrali) */
          values: (uu, vals) => {
            const gap = vals.length > 1 ? vals[1] - vals[0] : Infinity;
            return vals.map((t) => {
              const d = new Date(t * 1000);
              if (gap >= 540 * 86400) return String(d.getUTCFullYear());
              if (gap >= 45 * 86400) return p2(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
              if (gap >= 2 * 86400) return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1);
              return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes());
            });
          },
        }),
        Object.assign({}, axisCommon, {
          scale: 'y',
          label: 'Sollevamento',
          labelFont: '12px Arial',
          labelStroke: fg,
          values: (uu, vals) => {
            /* decimali in base alla distanza tra tick (i vals sono sempre aggiornati) */
            const gap = vals.length > 1 ? Math.abs(vals[1] - vals[0]) : Infinity;
            const dec = gap >= 0.2 ? 1 : gap >= 0.02 ? 2 : 3;
            return vals.map((v) => v.toFixed(dec).replace('.', ','));
          },
        }),
        Object.assign({}, axisCommon, {
          scale: 'y2',
          side: 1,
          grid: { show: false },
          /* firma: splits(u, axisIdx, min, max, ...) */
          splits: (uu, axisIdx, min, max) => {
            if (max - min > 4.5) return [0, 1, 2, 3, 4, 5];
            const steps = [1, 0.5, 0.25, 0.2, 0.1, 0.05, 0.025, 0.01];
            const step = steps.find((s) => (max - min) / s <= 8) || 0.01;
            const out = [];
            for (let v = Math.ceil((min - 1e-9) / step) * step; v <= max + 1e-9; v += step) out.push(+(v + step * 1e-6).toFixed(4));
            return out;
          },
          values: (uu, vals) => vals.map((v) => String(+(Math.round(v * 100) / 100))),
        }),
      ],
      series: [
        {},
        {
          label: 'Sollevamento',
          scale: 'y',
          stroke: 'transparent',
          paths: () => null,
          points: { show: true, size: 3.5, fill: purple, stroke: 'rgba(0,0,0,0.08)', width: 1 },
        },
      ],
      hooks: {
        draw: [(uu) => { drawQuakes(uu); syncMini(uu); }],
      },
    };
    const u = new uPlot(opts, [riteT, riteY], main);
    const over = u.over;
    const root = u.root;
    root.style.position = 'relative';
    over.style.touchAction = 'none';

    /* tooltip + rettangolo di selezione */
    const tip = document.createElement('div');
    tip.className = 'uptip';
    tip.style.display = 'none';
    root.appendChild(tip);
    const sel = document.createElement('div');
    sel.className = 'usel';
    sel.style.display = 'none';
    over.appendChild(sel); /* dentro l'area del grafico: coordinate già relative al plot */

    /* ---------- disegno terremoti (cerchi aperti colorati) ---------- */
    function drawQuakes(uu) {
      const ctx = uu.ctx;
      const dpr = ctx.canvas.width / ctx.canvas.clientWidth || 1;
      const x0 = uu.scales.x.min, x1 = uu.scales.x.max;
      const i0 = Math.max(0, lowerBound(eqT, x0) - 8);
      const i1 = Math.min(eqT.length, lowerBound(eqT, x1) + 8);
      ctx.save();
      ctx.beginPath();
      ctx.rect(uu.bbox.left, uu.bbox.top, uu.bbox.width, uu.bbox.height);
      ctx.clip();
      ctx.lineWidth = 1.4 * dpr;
      for (let i = i0; i < i1; i++) {
        const px = uu.valToPos(eqT[i], 'x', true);
        const py = uu.valToPos(eqMD[i], 'y2', true);
        ctx.beginPath();
        ctx.arc(px, py, 4 * eqMD[i] * dpr, 0, 6.28318);
        ctx.strokeStyle = eqColors[i];
        ctx.stroke();
      }
      ctx.restore();
    }

    /* ---------- minimappa (range date) ---------- */
    const mini = $('minimap');
    const miniWin = $('mini-win');
    const miniInner = $('minimap-inner');
    function drawMini() {
      const dpr = window.devicePixelRatio || 1;
      const w = mini.clientWidth, h = mini.clientHeight;
      if (w < 10) return;
      const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
      if (mini.width !== pw || mini.height !== ph) { mini.width = pw; mini.height = ph; }
      const ctx = mini.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const X = (t) => (t - T0) / (T1 - T0) * w;
      const Yr = (v) => h - (v - Y0) / (Y1 - Y0) * h;
      ctx.strokeStyle = purple;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < riteT.length; i++) {
        const x = X(riteT[i]), y = Yr(riteY[i]);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
      for (let i = 0; i < eqT.length; i++) {
        ctx.beginPath();
        ctx.arc(X(eqT[i]), h - eqMD[i] / MD_MAX * h, Math.max(1, eqMD[i] * 0.8), 0, 6.28318);
        ctx.fillStyle = eqColors[i];
        ctx.fill();
      }
    }
    function syncMini(uu) {
      const tipEl = document.querySelector('#main .uptip');
      if (tipEl) tipEl.style.display = 'none'; /* niente tooltip stantio dopo pan/zoom */
      const x0 = uu.scales.x.min, x1 = uu.scales.x.max;
      const w = mini.clientWidth;
      const l = (x0 - T0) / (T1 - T0) * w;
      const r = (x1 - T0) / (T1 - T0) * w;
      miniWin.style.left = l + 'px';
      miniWin.style.width = Math.max(2, r - l) + 'px';
      $('date-range').textContent = fmtDate(x0) + ' — ' + fmtDate(x1);
      $('count').textContent = countInRange(x0, x1).toLocaleString('it-IT');
    }

    /* ---------- aggiornamento scale (un solo aggiornamento per frame) ---------- */
    let pendingScales = null, rafId = 0;
    function setScales(xr, yr, yr2) {
      pendingScales = { xr, yr, yr2 };
      if (!rafId) rafId = requestAnimationFrame(() => {
        rafId = 0;
        const p = pendingScales;
        pendingScales = null;
        u.setScale('x', { min: p.xr[0], max: p.xr[1] });
        u.setScale('y', { min: p.yr[0], max: p.yr[1] });
        u.setScale('y2', { min: p.yr2[0], max: p.yr2[1] });
      });
    }
    const setXRange = (t0, t1) => setScales([t0, t1], [u.scales.y.min, u.scales.y.max], [u.scales.y2.min, u.scales.y2.max]);
    const resetView = () => setScales([T0, T1], [Y0, Y1], [Y2_0, Y2_1]);

    /* ---------- pan / zoom ---------- */
    let mode = 'zoom';
    const btnPan = $('btn-pan'), btnZoom = $('btn-zoom');
    function setMode(m) {
      mode = m;
      btnPan.classList.toggle('active', m === 'pan');
      btnZoom.classList.toggle('active', m === 'zoom');
    }
    btnPan.onclick = () => setMode('pan');
    btnZoom.onclick = () => setMode('zoom');

    const plotRect = () => over.getBoundingClientRect();
    let drag = null, selRect = null;

    over.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      over.setPointerCapture(e.pointerId);
      drag = {
        x0: e.clientX, y0: e.clientY, moved: false,
        xr: [u.scales.x.min, u.scales.x.max],
        yr: [u.scales.y.min, u.scales.y.max],
        yr2: [u.scales.y2.min, u.scales.y2.max],
      };
      hideTip();
    });
    over.addEventListener('pointermove', (e) => {
      if (drag) {
        const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
        if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        if (!drag.moved) return;
        if (mode === 'pan') applyPan(dx, dy);
        else {
          const r = plotRect();
          updateSel(e.clientX - r.left, e.clientY - r.top, r);
        }
      } else hover(e);
    });
    over.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const wasDrag = drag.moved;
      if (mode === 'zoom' && selRect && selRect.w > 6) {
        const t0 = u.posToVal(selRect.x, 'x');
        const t1 = u.posToVal(selRect.x + selRect.w, 'x');
        if (t1 - t0 > 60) setXRange(Math.min(t0, t1), Math.max(t0, t1));
      }
      drag = null;
      selRect = null;
      sel.style.display = 'none';
      if (!wasDrag) hover(e);
    });
    over.addEventListener('pointercancel', () => { drag = null; selRect = null; sel.style.display = 'none'; });

    function updateSel(cx, cy, r) {
      const x0 = clamp(drag.x0 - r.left, 0, r.width);
      const y0 = clamp(drag.y0 - r.top, 0, r.height);
      const x = clamp(cx, 0, r.width);
      const y = clamp(cy, 0, r.height);
      selRect = { x: Math.min(x, x0), w: Math.abs(x - x0), y: Math.min(y, y0), h: Math.abs(y - y0) };
      sel.style.display = 'block';
      sel.style.left = selRect.x + 'px';
      sel.style.top = selRect.y + 'px';
      sel.style.width = selRect.w + 'px';
      sel.style.height = selRect.h + 'px';
    }

    function applyPan(dx, dy) {
      const r = plotRect();
      const xs = drag.xr, ys = drag.yr, ys2 = drag.yr2;
      const xPerPx = (xs[1] - xs[0]) / r.width;
      let nx0 = xs[0] - dx * xPerPx, nx1 = xs[1] - dx * xPerPx;
      if (nx0 < T0) { nx1 = Math.min(T1, nx1 + (T0 - nx0)); nx0 = T0; }
      if (nx1 > T1) { nx0 = Math.max(T0, nx0 - (nx1 - T1)); nx1 = T1; }
      const yPerPx = (ys[1] - ys[0]) / r.height;
      const ny0 = ys[0] + dy * yPerPx, ny1 = ys[1] + dy * yPerPx;
      const y2PerPx = (ys2[1] - ys2[0]) / r.height;
      const ny20 = ys2[0] + dy * y2PerPx, ny21 = ys2[1] + dy * y2PerPx;
      setScales([nx0, nx1], [ny0, ny1], [ny20, ny21]);
    }

    over.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = plotRect();
      const cx = e.clientX - r.left, cy = e.clientY - r.top;
      const k = Math.exp(clamp(e.deltaY, -120, 120) * 0.0018);
      const xr = [u.scales.x.min, u.scales.x.max];
      const tx = u.posToVal(clamp(cx, 0, r.width), 'x');
      let nx0 = tx - (tx - xr[0]) * k, nx1 = tx + (xr[1] - tx) * k;
      if (nx1 - nx0 < MIN_SPAN) { const c = (nx0 + nx1) / 2; nx0 = c - MIN_SPAN / 2; nx1 = c + MIN_SPAN / 2; }
      if (nx1 - nx0 > T1 - T0) { nx0 = T0; nx1 = T1; }
      const yr = [u.scales.y.min, u.scales.y.max];
      const ty = u.posToVal(clamp(cy, 0, r.height), 'y');
      const ny0 = ty - (ty - yr[0]) * k, ny1 = ty + (yr[1] - ty) * k;
      const yr2 = [u.scales.y2.min, u.scales.y2.max];
      const ty2 = u.posToVal(clamp(cy, 0, r.height), 'y2');
      const ny20 = ty2 - (ty2 - yr2[0]) * k, ny21 = ty2 + (yr2[1] - ty2) * k;
      setScales([nx0, nx1], [ny0, ny1], [ny20, ny21]);
    }, { passive: false });

    over.addEventListener('dblclick', (e) => { e.preventDefault(); resetView(); });

    /* ---------- minimappa: maniglie e finestra ---------- */
    let miniDrag = null;
    miniInner.addEventListener('pointerdown', (e) => {
      const t = e.target;
      const which = t.id === 'mini-h0' ? 0 : t.id === 'mini-h1' ? 1 : (t === miniWin || t === mini) ? 2 : null;
      if (which === null) return;
      miniInner.setPointerCapture(e.pointerId);
      miniDrag = { which, startPx: e.clientX, x0: u.scales.x.min, x1: u.scales.x.max, w: mini.clientWidth };
    });
    miniInner.addEventListener('pointermove', (e) => {
      if (!miniDrag) return;
      const dt = (e.clientX - miniDrag.startPx) / miniDrag.w * (T1 - T0);
      if (miniDrag.which === 0) {
        const x1 = miniDrag.x1;
        setXRange(clamp(miniDrag.x0 + dt, T0, x1 - MIN_SPAN), x1);
      } else if (miniDrag.which === 1) {
        const x0 = miniDrag.x0;
        setXRange(x0, clamp(miniDrag.x1 + dt, x0 + MIN_SPAN, T1));
      } else {
        const span = miniDrag.x1 - miniDrag.x0;
        const nx0 = clamp(miniDrag.x0 + dt, T0, T1 - span);
        setXRange(nx0, nx0 + span);
      }
    });
    const endMini = () => { miniDrag = null; };
    miniInner.addEventListener('pointerup', endMini);
    miniInner.addEventListener('pointercancel', endMini);

    /* ---------- tooltip ---------- */
    function hideTip() { tip.style.display = 'none'; }
    function hover(e) {
      const r = plotRect();
      const cx = e.clientX - r.left, cy = e.clientY - r.top;
      if (cx < 0 || cy < 0 || cx > r.width || cy > r.height) { hideTip(); return; }
      const xSpan = u.scales.x.max - u.scales.x.min;
      const tolT = xSpan / r.width * 30; /* tolleranza orizzontale ~30px */
      const t = u.posToVal(cx, 'x');
      let best = null;
      const consider = (px, py, d, html) => { if ((!best || d < best.d) && d < 20) best = { d, html, px, py }; };
      let i0 = lowerBound(riteT, t - tolT), i1 = lowerBound(riteT, t + tolT);
      for (let i = Math.max(0, i0 - 1); i <= Math.min(riteT.length - 1, i1); i++) {
        const px = u.valToPos(riteT[i], 'x'), py = u.valToPos(riteY[i], 'y');
        consider(px, py, Math.hypot(px - cx, py - cy) - 2,
          '<b>Sollevamento</b><br>' + fmtDate(riteT[i]) + '<br>UP: ' + riteY[i].toFixed(5));
      }
      i0 = lowerBound(eqT, t - tolT); i1 = lowerBound(eqT, t + tolT);
      for (let i = Math.max(0, i0 - 1); i <= Math.min(eqT.length - 1, i1); i++) {
        const px = u.valToPos(eqT[i], 'x'), py = u.valToPos(eqMD[i], 'y2');
        consider(px, py, Math.hypot(px - cx, py - cy) - 4 * eqMD[i],
          '<b>Terremoto</b><br>' + fmtDT(eqT[i]) + '<br>MD: ' + eqMD[i].toFixed(2) + '<br>Z: ' + eqZ[i].toFixed(1) + ' m');
      }
      if (!best) { hideTip(); return; }
      tip.innerHTML = best.html;
      tip.style.display = 'block';
      const ro = root.getBoundingClientRect();
      const offX = r.left - ro.left, offY = r.top - ro.top;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let lx = offX + best.px + 14, ly = offY + best.py - th - 14;
      if (lx + tw > ro.width - 4) lx = offX + best.px - tw - 14;
      if (ly < 4) ly = offY + best.py + 14;
      tip.style.left = lx + 'px';
      tip.style.top = ly + 'px';
    }
    over.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') hideTip(); }); /* dopo un tap il pointerleave touch non deve nascondere il tooltip */

    /* ---------- pulsanti ---------- */
    function downloadPNG() {
      const cs = root.querySelectorAll('canvas');
      if (!cs.length) return;
      const out = document.createElement('canvas');
      out.width = cs[0].width; out.height = cs[0].height;
      const ctx = out.getContext('2d');
      ctx.fillStyle = card;
      ctx.fillRect(0, 0, out.width, out.height);
      for (const c of cs) ctx.drawImage(c, 0, 0);
      const a = document.createElement('a');
      a.href = out.toDataURL('image/png');
      a.download = 'Sollevamento-Terremoti.png';
      a.click();
    }

    const ro = new ResizeObserver(() => {
      u.setSize({ width: main.clientWidth, height: main.clientHeight });
      drawMini();
      syncMini(u);
    });
    ro.observe(main);

    drawMini();
    syncMini(u);
    $('reset').disabled = false;
    $('download').disabled = false;
    $('reset').onclick = resetView;
    $('download').onclick = downloadPNG;
    statusEl.hidden = true;
  } catch (err) {
    statusEl.textContent = err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
